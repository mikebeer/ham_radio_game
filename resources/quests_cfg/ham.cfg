; CQ Quest goals, in galene's QuestSystem .cfg format (chapter > quest > task).
; Facts are written by the game screens through FactDatabase; QuestSystem evaluates them.
; Every quest is "main" so the four goals sit in one chapter.

[chapter.goals]
display_name = "Become a ham radio operator"
description = "Four goals: know the rules, build your shack, make your first contact, learn Morse code."

[quest.rules]
chapter = "goals"
type = "main"
display_name = "Know the rules"
description = "Learn the legal basics for your country and pass the quiz."
start_conditions = "[]"
fail_conditions = "[]"
on_start_facts = "{}"
on_complete_facts = "{\"goal.rules\": true}"
on_fail_facts = "{}"

[task.rules.lessons]
display_name = "Read all lessons"
description = "Read all lessons"
auto_start = true
goal_conditions = "[{\"key\": \"rules.lessons_done\", \"op\": \"gte\", \"value\": 5}]"

[task.rules.quiz]
display_name = "Pass the quiz"
description = "Pass the quiz"
auto_start = true
goal_conditions = "[{\"key\": \"rules.quiz_passed\", \"op\": \"eq\", \"value\": true}]"

